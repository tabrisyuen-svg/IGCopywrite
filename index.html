<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IG 文案生成器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f4f8; min-height: 100vh; }

    .tab-bar {
      display: flex; gap: 0;
      background: white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      position: sticky; top: 0; z-index: 10;
    }
    .tab-btn {
      flex: 1; padding: 14px 8px;
      border: none; background: white;
      font-size: 13px; font-weight: 700;
      cursor: pointer; color: #aaa;
      border-bottom: 3px solid transparent;
      transition: all 0.18s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .tab-btn:hover { color: #555; }
    .tab-btn.active { color: #111; }
    .tab-btn.hape.active  { border-color: #6366f1; color: #6366f1; }
    .tab-btn.ek.active    { border-color: #f59e0b; color: #f59e0b; }
    .tab-btn.ric.active   { border-color: #10b981; color: #10b981; }

    .frame-wrap { display: none; width: 100%; height: calc(100vh - 49px); }
    .frame-wrap.active { display: block; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <div class="tab-bar">
    <button class="tab-btn hape active" onclick="show('hape', this)">🧸 Hape HK</button>
    <button class="tab-btn ek"          onclick="show('ek', this)">✨ Eurekakids HK</button>
    <button class="tab-btn ric"         onclick="show('ric', this)">🛍️ RicOutlet</button>
  </div>

  <div class="frame-wrap active" id="frame-hape">
    <iframe src="hapehk.html" loading="lazy"></iframe>
  </div>
  <div class="frame-wrap" id="frame-ek">
    <iframe src="eurekakids.html" loading="lazy"></iframe>
  </div>
  <div class="frame-wrap" id="frame-ric">
    <iframe src="ricoutlet.html" loading="lazy"></iframe>
  </div>

  <script>
    function show(id, btn) {
      document.querySelectorAll('.frame-wrap').forEach(f => f.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('frame-' + id).classList.add('active');
      btn.classList.add('active');
    }
  </script>
</body>
</html>
