<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hape HK IG 文案生成器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f4f8; color: #333; min-height: 100vh; }
    .container { max-width: 600px; margin: 0 auto; padding: 28px 16px; }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #111; }
    .card { background: white; border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
    label { display: block; font-size: 12px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    input[type="text"] { width: 100%; padding: 11px 14px; border: 1.5px solid #e5e5e5; border-radius: 9px; font-size: 14px; outline: none; transition: border-color 0.2s; color: #333; }
    input[type="text"]:focus { border-color: #6366f1; }
    .gen-btn { width: 100%; padding: 13px; background: #6366f1; color: white; border: none; border-radius: 9px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
    .gen-btn:hover { background: #4f46e5; }
    .gen-btn:disabled { background: #a5b4fc; cursor: not-allowed; }
    .status { font-size: 13px; text-align: center; min-height: 18px; margin-top: 10px; color: #888; }
    .status.error { color: #ef4444; }
    .status.success { color: #10b981; }
    .preview-box { margin-top: 12px; background: #f8f8fc; border-radius: 8px; padding: 10px 13px; font-size: 13px; color: #555; display: none; }
    .preview-box.show { display: block; }
    .preview-box strong { color: #333; }
    textarea { width: 100%; min-height: 260px; padding: 13px; border: 1.5px solid #e5e5e5; border-radius: 9px; font-size: 14px; line-height: 1.75; resize: vertical; font-family: inherit; outline: none; color: #333; }
    .copy-btn { width: 100%; padding: 11px; background: #10b981; color: white; border: none; border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    .copy-btn:hover { background: #059669; }
    #outputCard { display: none; }
  </style>
</head>
<body>
<div class="container">
  <h1>🧸 Hape HK IG 文案生成器</h1>

  <div class="card">
    <label>產品連結</label>
    <input type="text" id="urlInput" placeholder="https://www.hapehk.com/zh-hant/products/..." />
    <div class="preview-box" id="previewBox"></div>
  </div>

  <div class="card">
    <button class="gen-btn" id="genBtn">生成文案</button>
    <div class="status" id="status"></div>
  </div>

  <div class="card" id="outputCard">
    <label>生成結果</label>
    <textarea id="output" readonly></textarea>
    <button class="copy-btn" id="copyBtn">📋 複製文案</button>
  </div>
</div>

<script>

    copy:`4-in-1 Learning Tricycle｜Hape 4-in-1 學習三輪車\n\n推一推、踩一踩、滑一滑，陪孩子由第一程出發，慢慢騎出平衡感、自信心與成長節奏。\n\n這款 Hape 4-in-1 學習三輪車結合四種成長模式，從推行三輪車、學步車、踩踏三輪車到平衡車，按孩子不同發展階段靈活轉換，讓每一次騎行都成為探索身體協調與方向控制的學習體驗。\n\n車身設計輕巧便攜，僅重 4.2 公斤，配合三段可調推把、可調座高、避震 EVA 車輪、防滑踏板及舒適握把，讓家長推行更輕鬆，孩子騎乘更安心。透過反覆練習踩踏、轉向與平衡，不但有助促進大肌肉發展與手眼協調，亦能逐步提升孩子的自信心與身體控制能力，是一款可陪伴 18 個月以上孩子持續成長的長期騎乘玩具。\n\n🚲 Push, ride and balance into every growing milestone.\n\n#Hape #EurekakidsHK #4in1LearningTricycle #學習三輪車 #成長型三輪車 #平衡車 #GrossMotorSkills #BalanceDevelopment #OutdoorPlay #LearningThroughPlay` },

// =============================================
// 設定
// =============================================
const EMOJI_MAP = [
  ['音樂|musical|music|band|drum','🎵'],['熊貓|panda','🐼'],['兔|bunny|rabbit','🐰'],
  ['火車|train|tunnel|railway|鐵道','🚂'],['廚房|kitchen|food|食物','🍳'],
  ['積木|block','🧩'],['感官|sensory','✨'],['三輪車|tricycle|ride','🚲'],
  ['沙|sand','🏖️'],['探險|explorer','🔭'],['公仔|plush','🧸'],
  ['拼圖|puzzle','🧩'],['購物|basket|shopping','🛒'],['酪梨|avocado|fidget','🥑'],
  ['畫|art|craft','🎨'],['娃娃|doll','🪆'],['平衡|balance','⚖️']
];

const HASHTAG_RULES = [
  ['音樂|musical|music|band|drum','#MusicPlay','#MusicalToy','#RhythmAndPlay'],
  ['感官|sensory','#SensoryPlay','#EarlyLearning'],
  ['積木|block|abc','#BuildingBlocks','#EarlyLearning'],
  ['火車|train|tunnel|railway|鐵道','#TrainPlay','#WoodenTrain'],
  ['廚房|kitchen|food|食物|扮家家','#PretendPlay','#KitchenPlay'],
  ['娃娃屋|dollhouse|doll','#DollHouse','#PretendPlay'],
  ['三輪車|tricycle|balance|ride','#OutdoorPlay','#GrossMotorSkills','#BalanceDevelopment'],
  ['拼圖|puzzle','#PuzzlePlay','#CognitiveDevelopment'],
  ['沙|sand','#SandPlay','#OutdoorPlay'],
  ['art|craft|藝術|畫','#ArtAndCraft','#CreativeExpression'],
  ['baby einstein','#BabyEinstein'],
  ['magic touch','#MagicTouch'],
  ['fidget|減壓','#FidgetToy','#FocusPlay','#CalmAndLearn'],
  ['精細|fine motor|抓握','#FineMotorSkills'],
  ['語言|language','#LanguageDevelopment'],
  ['情商|emotional','#EmotionalDevelopment'],
  ['嬰|infant|baby','#BabyToys'],
  ['木|wood','#WoodenToy'],
];

// =============================================
// 工具函數
// =============================================
function stripHtml(html) {
  const d = document.createElement('div');
  d.innerHTML = html || '';
  return d.textContent || d.innerText || '';
}

function getSentences(text) {
  return text.replace(/\s+/g,' ').split(/(?<=[。！？\.!?])\s*/).map(s=>s.trim().replace(/[。！？\.!?]+$/,'')).filter(s=>s.length>4);
}

function getEmoji(text) {
  const t = text.toLowerCase();
  for (const [keys, emoji] of EMOJI_MAP) {
    if (keys.split('|').some(k => t.includes(k))) return emoji;
  }
  return '🌟';
}

function getHashtags(title, desc, vendor) {
  const t = (title+' '+desc+' '+vendor).toLowerCase();
  const tags = new Set(['#Hape','#HapeHK','#LearningThroughPlay','#CreativePlay']);
  HASHTAG_RULES.forEach(([keys, ...htags]) => {
    if (keys.split('|').some(k => t.includes(k.toLowerCase()))) htags.forEach(h => tags.add(h));
  });
  return Array.from(tags).slice(0,10).join(' ');
}

function fmt(price) {
  return parseFloat(price).toFixed(2).replace(/\.00$/,'');
}

// =============================================
// 格式 A 生成
// =============================================
function genA(p, url) {
  const desc = getSentences(stripHtml(p.body_html));
  const para1 = desc.slice(0,2).join('。') + (desc.slice(0,2).length ? '。' : '');
  const para2 = desc.slice(2,4).join('。') + (desc.slice(2,4).length ? '。' : '');
  const emoji = getEmoji(p.title + para1);
  const tags = getHashtags(p.title, para1 + para2, p.vendor);
  const hook = `探一探、玩一玩、學一學，${p.title} 陪孩子開始每一次探索。`;
  const tagline = `${emoji} Explore, play and grow through joyful discovery.`;
  const parts = [`Hape｜${p.title}`, hook];
  if (para1) parts.push(para1);
  if (para2) parts.push(para2);
  parts.push(tagline, `🔗 ${url}`, tags);
  return parts.join('\n\n');
}

// =============================================
// UI
// =============================================
document.getElementById('genBtn').addEventListener('click', async () => {
  const raw = document.getElementById('urlInput').value.trim();
  if (!raw) return setStatus('請貼入產品連結', 'error');
  if (!raw.includes('hapehk.com')) return setStatus('請貼入 Hape HK 產品連結', 'error');
  if (!raw.includes('/products/')) return setStatus('連結需包含 /products/', 'error');

  const cleanUrl = raw.replace(/\?.*$/,'').replace(/\/$/,'');
  // 移除 locale prefix 以取得正確 JSON endpoint
  const jsonUrl = cleanUrl.replace(/\/[a-z]{2}-[a-z]{4}\/products\//i, '/products/') + '.json';

  setStatus('正在抓取資料…', '');
  document.getElementById('genBtn').disabled = true;

  try {
    const res = await fetch(jsonUrl);
    if (!res.ok) throw new Error();
    const { product } = await res.json();

    const pb = document.getElementById('previewBox');
    pb.innerHTML = `<strong>${product.title}</strong><br>HK$${fmt(product.variants[0].price)}`;
    pb.classList.add('show');

    document.getElementById('output').value = genA(product, cleanUrl);
    document.getElementById('outputCard').style.display = 'block';
    setStatus('✅ 生成完成！', 'success');
  } catch {
    setStatus('❌ 無法抓取資料，請確認連結', 'error');
  } finally {
    document.getElementById('genBtn').disabled = false;
  }
});

document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(document.getElementById('output').value).then(() => {
    const b = document.getElementById('copyBtn');
    b.textContent = '✅ 已複製！';
    setTimeout(() => b.textContent = '📋 複製文案', 2000);
  });
});

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (type ? ' '+type : '');
}
</script>
</body>
</html>
